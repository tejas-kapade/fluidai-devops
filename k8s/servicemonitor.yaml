apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluidai-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - fluidai
  selector:
    matchLabels:
      app: fluidai-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
